apiVersion: v1
kind: ConfigMap
metadata:
  name: afronova-proxy-nginx
  namespace: staging
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://afronova-frontend-svc.afronova.svc.cluster.local;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: afronova-ingress-proxy
  namespace: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: afronova-ingress-proxy
  template:
    metadata:
      labels:
        app: afronova-ingress-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: afronova-proxy-nginx

---
apiVersion: v1
kind: Service
metadata:
  name: afronova-proxy
  namespace: staging
spec:
  type: NodePort
  selector:
    app: afronova-ingress-proxy
  ports:
    - name: http
      port: 80
      targetPort: 80