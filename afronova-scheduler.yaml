apiVersion: apps/v1
kind: Deployment

metadata:
  name: afronova-scheduler
  namespace: afronova
  labels:
    app: afronova-scheduler

spec:
  # Exactly one replica, or every scheduled task runs once per replica.
  replicas: 1

  # Recreate stops the old pod before the new one starts, so two schedulers
  # never overlap during a rollout.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: afronova-scheduler

  template:
    metadata:
      labels:
        app: afronova-scheduler

    spec:
      imagePullSecrets:
        - name: munyua-arch-ghcr-secret

      containers:
        - name: afronova-scheduler
          image: ghcr.io/munyua-arch/afronova-backend:v1.5.1
          imagePullPolicy: Always

          command: ["php", "artisan", "schedule:work"]

          env:
            - name: APP_ENV
              value: "production"

            - name: APP_DEBUG
              value: "false"

            - name: APP_URL
              value: "https://pos.afronova.co.ke"

            - name: APP_FRONTEND_URL
              value: "https://pos.afronova.co.ke"

            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: afronova-backend-secret
                  key: APP_KEY

            - name: LOG_CHANNEL
              value: "stderr"

            - name: LOG_LEVEL
              value: "info"

            - name: MAIL_MAILER
              value: "resend"

            - name: MAIL_FROM_ADDRESS
              value: "noreply@afronova.co.ke"

            - name: MAIL_FROM_NAME
              value: "AfroNova"

            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: afronova-backend-secret
                  key: RESEND_API_KEY

            - name: DB_CONNECTION
              value: "pgsql"

            - name: DB_HOST
              value: "afronova-postgres"

            - name: DB_PORT
              value: "5432"

            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: afronova-postgres-secret
                  key: POSTGRES_DB

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: afronova-postgres-secret
                  key: POSTGRES_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: afronova-postgres-secret
                  key: POSTGRES_PASSWORD

            - name: CACHE_STORE
              value: "database"

            - name: QUEUE_CONNECTION
              value: "database"

          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"